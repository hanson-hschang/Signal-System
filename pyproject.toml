[project]
name = "Signal-System"
version = "0.0.2"
description = "A package for signal and system simulation, design, analysis, and learning."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    {name = "Heng-Sheng Chang", email = "hanson.hschang+signal.system@gmail.com"}
]
keywords = ["Signal", "System", "Learning"]

# Pypi classifiers: https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "jax>=0.10.0",
    "equinox>=0.13.0",
    "optax>=0.2.0",
    "tqdm>=4.66.0",
    "h5py>=3.10.0",
    "click>=8.1.0",
    "matplotlib>=3.8.0",
    "grain>=0.2.0",
    "jaxtyping>=0.2.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "scipy>=1.11.0",
    "pre-commit>=3.7.1",
    "pytest>=8.2.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14.0",
    "ruff",
    "mypy>=1.10.0",
]

[project.urls]
# Homepage = "https://example.com"
# Documentation = "https://readthedocs.org"
Repository = "https://github.com/hanson-hschang/Signal-System"
Issues = "https://github.com/hanson-hschang/Signal-System/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Tell Hatch where to find your package source code.
packages = ["src/ss"]

[tool.hatch.build.targets.sdist]
# Ensure the source directory is included in the source distribution.
include = ["/src"]

[tool.pytest.ini_options]
norecursedirs = [
    "hooks",
    "*.egg",
    ".eggs",
    "dist",
    "build",
    "docs",
    ".tox",
    ".git",
    "__pycache__",
]
doctest_optionflags = [
    "NUMBER",
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ELLIPSIS",
]
addopts = [
    "--strict-markers",
    "--tb=short",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover", # Enable pragma
    "TODO",
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == __main__:",
    "def __repr__",
    "def plot_.*\\b",
    "if self.debug:",
    "if settings.DEBUG",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\."
]
fail_under = 30
show_missing = true

[tool.coverage.run]
branch = true
omit = [
    "*/.local/*",
    "setup.py",
]

[tool.ruff]
# Set the line length for both the linter and formatter.
line-length = 79

# Set the target Python version.
target-version = "py313"

# Define files and directories to be excluded from checks.
# Ruff uses glob patterns and merges the lists.
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "__pycache__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "env",
    "venv",
]

[tool.ruff.lint]
# Select the rule sets to enable.
# "E" (pycodestyle errors), "W" (pycodestyle warnings), and "F" (Pyflakes)
# are a good starting point to replicate flake8's default behavior.
select = ["E", "F", "W", "UP"]
ignore = [
    # For JAX + jaxtyping
    "E731",  # Allow lambda! :)
    "F722",  # Syntax error in forward annotation (triggered by multi-dimensional jaxtyping shapes)
    "F821",  # Undefined name (optional, if single-dimension shapes trigger it)
    "UP037",  # Keep quotes on jaxtyping shape strings (e.g. Float[Array, "state_dim"])
    # Keep typing.Generic / TypeVar for now (PEP 695 migration is a separate change)
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
# https://mypy.readthedocs.io/en/latest/config_file.html#using-a-pyproject-toml-file
python_version = "3.13"
pretty = true
show_traceback = true
color_output = true
strict = true
explicit_package_bases = true
namespace_packages = true
allow_redefinition = false
check_untyped_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_any_generics = false
disallow_incomplete_defs = true
ignore_missing_imports = true
implicit_reexport = true
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = false
warn_unused_configs = true
warn_unused_ignores = true
exclude = [
    'src/draft/.*\.py$',
]
